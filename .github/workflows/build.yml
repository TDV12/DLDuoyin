              }
              private static Photo pick(Photo best,Object raw,int w,int h){
                  if(!(raw instanceof String))return best;
                  try { URI u=URI.create((String)raw); if(!InstagramPublicImage.isImageHost(u))return best;
                      Photo p=new Photo(u,w,h); return best==null||p.area()>best.area()?p:best;
