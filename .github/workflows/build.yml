      - name: Build APK
        working-directory: qingzai
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare APK and license
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp qingzai/app/build/outputs/apk/debug/app-debug.apk dist/DouyinInstagram-V5.1-VN.apk
          cp qingzai/LICENSE dist/LICENSE-QingZai.txt
          git -C qingzai rev-parse HEAD > dist/UPSTREAM-COMMIT.txt
          sha256sum dist/DouyinInstagram-V5.1-VN.apk > dist/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DouyinInstagram-V5.1-VN
          path: dist/
          if-no-files-found: error
