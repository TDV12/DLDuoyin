                  void ws(){while(i<s.length()&&Character.isWhitespace(s.charAt(i)))i++;}
                  boolean eat(char c){ws(); if(i<s.length()&&s.charAt(i)==c){i++;return true;}return false;}
                  void need(char c){if(!eat(c))bad();}
                  void bad(){throw new IllegalArgumentException("Invalid JSON");}
                  Object value(int depth){
                      ws(); if(depth>120||i>=s.length())bad(); char c=s.charAt(i);
                      if(c=='{'){i++;Map<String,Object> m=new LinkedHashMap<>();if(eat('}'))return m;do{ws();String k=string();need(':');m.put(k,value(depth+1));}while(eat(','));need('}');return m;}
                      if(c=='['){i++;List<Object> a=new ArrayList<>();if(eat(']'))return a;do{a.add(value(depth+1));}while(eat(','));need(']');return a;}
                      if(c=='"')return string();
                      if(s.startsWith("true",i)){i+=4;return true;}if(s.startsWith("false",i)){i+=5;return false;}if(s.startsWith("null",i)){i+=4;return null;}
                      int start=i; if(c=='-')i++;
                      while(i<s.length()&&Character.isDigit(s.charAt(i)))i++;
                      if(i<s.length()&&s.charAt(i)=='.'){i++;while(i<s.length()&&Character.isDigit(s.charAt(i)))i++;}
                      if(i<s.length()&&(s.charAt(i)=='e'||s.charAt(i)=='E')){i++;if(i<s.length()&&(s.charAt(i)=='+'||s.charAt(i)=='-'))i++;while(i<s.length()&&Character.isDigit(s.charAt(i)))i++;}
                      if(start==i)bad(); return Double.valueOf(s.substring(start,i));
                  }
                  String string(){
                      if(i>=s.length()||s.charAt(i++)!='"')bad();StringBuilder b=new StringBuilder();
                      while(i<s.length()){
                          char c=s.charAt(i++);if(c=='"')return b.toString();if(c<32)bad();
                          if(c!='\\'){b.append(c);continue;}if(i>=s.length())bad();c=s.charAt(i++);
