                  List<?> children=list(m.get("carousel_media")); boolean modern=m.get("carousel_media") instanceof List;
                  if(!modern) children=list(edge.get("edges"));
                  boolean carousel=modern||m.get("edge_sidecar_to_children") instanceof Map||num(m.get("media_type"))==8||"GraphSidecar".equals(str(m.get("__typename")));
                  List<Photo> photos=new ArrayList<>(); Set<URI> seen=new HashSet<>();
                  if(carousel){
