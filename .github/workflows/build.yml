name: Build Douyin Instagram V5.1 VN

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Commit QingZai from V4 UPSTREAM-COMMIT.txt (optional)"
        required: false
        default: "main"
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Get QingZai upstream source
        uses: actions/checkout@v4
        with:
          repository: Yukioooooo0/QingZai
          ref: ${{ inputs.upstream_ref || 'main' }}
          path: qingzai
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$sdk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          missing=()
          for pkg in 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'; do
            if [[ ! -d "$sdk/${pkg/;/\/}" ]]; then missing+=("$pkg"); fi
          done
          if (( ${#missing[@]} )); then
            manager=$(find "$sdk/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
            test -n "$manager"
            yes | "$manager" --sdk_root="$sdk" --licenses >/dev/null || true
            "$manager" --sdk_root="$sdk" "${missing[@]}"
          fi

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Vietnamese interface labels
        working-directory: qingzai
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = Path('app/src/main')
          ui = base / 'java/com/douyin/downloader/ui'
          labels = {
              '轻载': 'Douyin + Instagram VN',
              '粘贴视频或图片链接...': 'Dán liên kết video hoặc ảnh...',
              '清除': 'Xóa', '解析': 'Phân tích',
              '输入链接以获取媒体内容': 'Nhập liên kết để lấy nội dung',
              '正在解析链接，请稍候...': 'Đang phân tích liên kết...',
              '无标题': 'Không có tiêu đề', '下载视频': 'Tải video',
              '下载视频（含音乐）': 'Tải video (kèm nhạc)',
              '解析结果': 'Kết quả phân tích', '取消全选': 'Bỏ chọn tất cả',
              '全选': 'Chọn tất cả', '下载': 'Tải xuống', '历史': 'Lịch sử',
              '下载中心': 'Trung tâm tải xuống', '清空记录': 'Xóa nhật ký',
              '暂无下载任务': 'Chưa có tác vụ tải', '下载中...': 'Đang tải...',
              '等待中': 'Đang chờ', '已完成': 'Đã hoàn tất', '刚刚': 'Vừa xong',
              '历史记录': 'Lịch sử', '清空历史': 'Xóa lịch sử',
              '暂无历史记录': 'Chưa có lịch sử', '视频': 'Video',
              '图文': 'Ảnh và văn bản', '动图': 'Ảnh động',
              '下载所选 (${state.selectedImages.size})': 'Tải mục đã chọn (${state.selectedImages.size})',
              '${minutes}分钟前': '${minutes} phút trước',
              '${hours}小时前': '${hours} giờ trước',
              '${days}天前': '${days} ngày trước',
          }
          files = ['home/HomeScreen.kt', 'navigation/AppNavigation.kt',
                   'downloads/DownloadsScreen.kt', 'history/HistoryScreen.kt']
          total = 0
          for name in files:
              path = ui / name
              content = path.read_text(encoding='utf-8')
              for old, new in labels.items():
                  before, after = '"' + old + '"', '"' + new + '"'
                  total += content.count(before)
                  content = content.replace(before, after)
              path.write_text(content, encoding='utf-8')
          if total == 0:
              raise SystemExit('Upstream UI changed; review the translation mapping.')
          manifest = base / 'AndroidManifest.xml'
          text = manifest.read_text(encoding='utf-8')
          manifest.write_text(text.replace('android:label="轻载"',
              'android:label="Douyin + Instagram VN"'), encoding='utf-8')
          # Install beside previous builds, without changing Kotlin package names.
          build = Path('app/build.gradle.kts')
          text = build.read_text(encoding='utf-8')
          old = 'applicationId = "com.douyin.downloader"'
          if old not in text:
              raise SystemExit('Upstream applicationId changed; review before building.')
          build.write_text(text.replace(old, 'applicationId = "com.douyin.downloader.vn.v51"', 1), encoding='utf-8')
          print(f'Localized {total} UI string occurrences.')
          PY

      - name: Add Instagram album downloader and run parser tests
        working-directory: qingzai
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          base = Path('app/src/main')
          manifest = base / 'AndroidManifest.xml'
          text = manifest.read_text(encoding='utf-8')
          if text.count('</application>') != 1:
              raise SystemExit('Cannot locate application manifest block')
          text = text.replace('</application>', '<activity android:name="com.douyin.downloader.InstagramImageActivity" android:exported="false" />\n    </application>')
          manifest.write_text(text, encoding='utf-8')
          home = base / 'java/com/douyin/downloader/ui/home/HomeScreen.kt'
          text = home.read_text(encoding='utf-8')
          marker = 'val state by viewModel.uiState.collectAsState()'
          if text.count(marker) != 1 or text.count('// Input') != 1:
              raise SystemExit('HomeScreen changed: review V5 patch')
          text = text.replace(marker, marker + '\n    val instagramContext = androidx.compose.ui.platform.LocalContext.current', 1)
          button = 'Button(\n    onClick = {\n        val intent = android.content.Intent(instagramContext, com.douyin.downloader.InstagramImageActivity::class.java)\n        intent.putExtra("image_input", state.inputUrl)\n        instagramContext.startActivity(intent)\n    },\n    modifier = Modifier.fillMaxWidth()\n) { Text("Tải ảnh Instagram") }\nSpacer(modifier = Modifier.height(8.dp))\n'
          text = text.replace('// Input', button + '\n            // Input', 1)
          home.write_text(text, encoding='utf-8')
          PY
          cat > app/src/main/java/com/douyin/downloader/InstagramImageActivity.java <<'JAVA'
          package com.douyin.downloader;
          
          import android.app.Activity;
          import android.content.*;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.view.ViewGroup;
          import android.widget.*;
          import java.io.*;
          import java.net.*;
          import java.nio.charset.StandardCharsets;
          import java.util.*;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          
          public final class InstagramImageActivity extends Activity {
              private final ExecutorService executor = Executors.newSingleThreadExecutor();
              private EditText input;
              private TextView status;
              private ImageView preview;
              private Button analyze, save, paste, prev, next, all;
              private TextView position;
              private List<InstagramAlbum.Photo> photos = Collections.emptyList();
              private int index;
              private boolean previewOnly;
              private String albumSummary = "";
              private CheckBox permission;
              private byte[] image;
              private String mime, filename;
              private static final int PICK_FILE = 51;
              private static final int MAX_IMAGE = 20 * 1024 * 1024;
              private static final int MAX_HTML = 12 * 1024 * 1024;
              private int dp(int n) { return Math.round(n * getResources().getDisplayMetrics().density); }
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  ScrollView scroll = new ScrollView(this);
                  scroll.setClipToPadding(false);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(dp(20), dp(28), dp(20), dp(24));
                  scroll.addView(layout);
                  setContentView(scroll);
                  TextView title = new TextView(this);
                  title.setText("Tải ảnh Instagram"); title.setTextSize(24); layout.addView(title);
                  TextView hint = new TextView(this);
                  hint.setText("Dán liên kết bài viết công khai. App chọn ảnh có độ phân giải cao nhất được cung cấp, không bảo đảm là tệp gốc. Chỉ lưu ảnh bạn có quyền sử dụng.");
                  layout.addView(hint);
                  input = new EditText(this); input.setHint("https://www.instagram.com/p/...");
                  input.setInputType(android.text.InputType.TYPE_CLASS_TEXT | android.text.InputType.TYPE_TEXT_FLAG_MULTI_LINE);
                  input.setMaxLines(4); layout.addView(input);
                  String shared = getIntent().getStringExtra("image_input");
                  if (shared != null) input.setText(shared);
                  paste = new Button(this); paste.setText("Dán liên kết"); layout.addView(paste);
                  paste.setOnClickListener(v -> {
                      ClipboardManager cb = (ClipboardManager)getSystemService(CLIPBOARD_SERVICE);
                      if (cb != null && cb.hasPrimaryClip()) {
                          ClipData data = cb.getPrimaryClip();
                          if (data != null && data.getItemCount() > 0) input.setText(data.getItemAt(0).coerceToText(this));
                      }
                  });
                  analyze = new Button(this); analyze.setText("Phân tích / xem ảnh"); layout.addView(analyze);
                  permission = new CheckBox(this); permission.setText("Tôi có quyền lưu các ảnh này"); layout.addView(permission);
                  preview = new ImageView(this); preview.setAdjustViewBounds(true); preview.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  layout.addView(preview, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(300)));
                  LinearLayout nav = new LinearLayout(this); nav.setOrientation(LinearLayout.HORIZONTAL);
                  prev = new Button(this); prev.setText("Ảnh trước"); nav.addView(prev,new LinearLayout.LayoutParams(0,dp(52),1));
                  next = new Button(this); next.setText("Ảnh sau"); nav.addView(next,new LinearLayout.LayoutParams(0,dp(52),1)); layout.addView(nav);
                  position = new TextView(this); layout.addView(position);
                  status = new TextView(this); status.setText("Chưa có ảnh. Không hỗ trợ bài riêng tư hoặc yêu cầu đăng nhập."); layout.addView(status);
                  save = new Button(this); save.setText("Lưu ảnh vào điện thoại"); save.setEnabled(false); layout.addView(save);
                  all = new Button(this); all.setText("Lưu tất cả ảnh tìm thấy"); all.setEnabled(false); layout.addView(all);
                  Button back = new Button(this); back.setText("Quay lại Douyin"); layout.addView(back); back.setOnClickListener(v -> finish());
                  permission.setOnCheckedChangeListener((v, checked) -> refreshButtons());
                  prev.setOnClickListener(v -> showPhoto(index-1)); next.setOnClickListener(v -> showPhoto(index+1));
                  all.setOnClickListener(v -> saveAll());
                  analyze.setOnClickListener(v -> loadImage());
                  save.setOnClickListener(v -> saveImage());
                  refreshButtons();
              }
              private void refreshButtons() {
                  boolean idle=analyze.isEnabled(); boolean canSave=idle && permission.isChecked() && !previewOnly;
                  prev.setEnabled(idle && index>0 && !photos.isEmpty()); next.setEnabled(idle && index+1<photos.size());
                  save.setEnabled(canSave && image!=null);
                  all.setEnabled(canSave && Build.VERSION.SDK_INT>=29 && photos.size()>1);
                  if(Build.VERSION.SDK_INT<29)all.setText("Android 8–9: lưu từng ảnh");
                  position.setText(photos.isEmpty()?"":("Ảnh "+(index+1)+" / "+photos.size()+" · "+albumSummary));
              }
              private void busy(boolean value) { analyze.setEnabled(!value); paste.setEnabled(!value); input.setEnabled(!value); refreshButtons(); }
              private void loadImage() {
                  String text = input.getText().toString();
                  image=null; mime=null; filename=null; photos=Collections.emptyList(); index=0; previewOnly=false; albumSummary="";
                  preview.setImageDrawable(null); permission.setChecked(false);
                  busy(true); status.setText("Đang phân tích bài đăng công khai...");
                  executor.execute(() -> {
                      try {
                          URI url=InstagramPublicImage.extract(text);
                          List<InstagramAlbum.Photo> found;
                          String summary; boolean onlyPreview=false;
                          if(InstagramPublicImage.isPost(url)) {
                              Data page=fetch(url,MAX_HTML,true);
                              String html=new String(page.bytes,StandardCharsets.UTF_8);
                              String code=url.getPath().split("/")[2];
                              InstagramAlbum.Result result=InstagramAlbum.parse(html,code);
                              found=result.photos;
                              if(found.isEmpty()) {
                                  URI thumb=InstagramPublicImage.previewUrl(html);
                                  if(thumb==null) throw new IOException("Instagram không cung cấp dữ liệu ảnh công khai. Không hỗ trợ vượt giới hạn truy cập.");
                                  found=Collections.singletonList(new InstagramAlbum.Photo(thumb,0,0));
                                  onlyPreview=true;
                                  summary="Chỉ có ảnh đại diện; không lưu như ảnh chất lượng cao.";
                              } else {
                                  summary=result.carousel ? ("Album: "+found.size()+" ảnh; "+result.itemsFound+" mục nhận diện"+(result.expected>result.itemsFound?" / "+result.expected+" mục dự kiến (chưa đủ)":"")+". Bỏ qua video.") : "Ảnh bài đăng";
                              }
                          } else { found=Collections.singletonList(new InstagramAlbum.Photo(url,0,0)); summary="URL ảnh trực tiếp"; }
                          final List<InstagramAlbum.Photo> ready=found; final String detail=summary; final boolean fallback=onlyPreview;
                          runOnUiThread(() -> { if(isFinishing()||isDestroyed())return; photos=ready; albumSummary=detail; previewOnly=fallback; showPhoto(0); });
                      } catch(Exception ex) { showError(ex); }
                  });
              }
              private static String extension(String mime) throws IOException {
                  switch(mime){case "image/jpeg":return "jpg";case "image/png":return "png";case "image/webp":return "webp";case "image/gif":return "gif";default:throw new IOException("Định dạng ảnh chưa hỗ trợ.");}
              }
              private static BitmapFactory.Options dimensions(Data data) throws IOException {
                  extension(data.mime);
                  BitmapFactory.Options d=new BitmapFactory.Options(); d.inJustDecodeBounds=true;
                  BitmapFactory.decodeByteArray(data.bytes,0,data.bytes.length,d);
                  if(d.outWidth<=0||d.outHeight<=0)throw new IOException("Tệp ảnh không hợp lệ."); return d;
              }
              private void showPhoto(int target) {
                  if(target<0||target>=photos.size())return;
                  index=target; image=null; mime=null; filename=null; preview.setImageDrawable(null); busy(true);
                  status.setText("Đang tải ảnh "+(index+1)+"...");
                  InstagramAlbum.Photo photo=photos.get(target);
                  executor.execute(() -> {
                      try {
                          Data data=fetch(photo.url,MAX_IMAGE,false); BitmapFactory.Options d=dimensions(data);
                          BitmapFactory.Options opt=new BitmapFactory.Options(); opt.inSampleSize=1;
                          while(Math.max(d.outWidth,d.outHeight)/opt.inSampleSize>1800)opt.inSampleSize*=2;
                          Bitmap bitmap=BitmapFactory.decodeByteArray(data.bytes,0,data.bytes.length,opt);
                          if(bitmap==null)throw new IOException("Không đọc được ảnh.");
                          String name="Instagram_"+System.currentTimeMillis()+"_"+(target+1)+"."+extension(data.mime);
                          runOnUiThread(() -> {
                              if(isFinishing()||isDestroyed()){bitmap.recycle();return;}
                              image=data.bytes; mime=data.mime; filename=name; preview.setImageBitmap(bitmap);
                              status.setText((previewOnly?"Chỉ ảnh đại diện – không lưu":"Tệp ảnh được cung cấp, không nén lại")+" · "+d.outWidth+" × "+d.outHeight+" px"+(photo.width>0&&photo.height>0&&(d.outWidth<photo.width||d.outHeight<photo.height)?" (thấp hơn kích thước khai báo)":"")); busy(false);
                          });
                      }catch(Exception ex){showError(ex);}
                  });
              }
              private void saveAll(){
                  if(Build.VERSION.SDK_INT<29||previewOnly||!permission.isChecked()||photos.size()<2)return;
                  final List<InstagramAlbum.Photo> batch=new ArrayList<>(photos); final long stamp=System.currentTimeMillis();
                  final int selected=index; final byte[] cached=image; final String cachedMime=mime;
                  busy(true);
                  executor.execute(() -> {
                      int ok=0; int failed=0;
                      for(int k=0;k<batch.size()&&!Thread.currentThread().isInterrupted();k++){
                          final int progress=k+1;
                          runOnUiThread(() -> {if(!isFinishing()&&!isDestroyed())status.setText("Đang lưu "+progress+" / "+batch.size());});
                          try{
                              Data data=(k==selected&&cached!=null)?new Data(cached,cachedMime):fetch(batch.get(k).url,MAX_IMAGE,false);
                              dimensions(data); saveToGallery(data.bytes,data.mime,"Instagram_"+stamp+"_"+(k+1)+"."+extension(data.mime)); ok++;
                          }catch(Exception ex){failed++;}
                      }
                      final int saved=ok,errors=failed;
                      runOnUiThread(() -> {if(!isFinishing()&&!isDestroyed()){status.setText("Đã lưu "+saved+" / "+batch.size()+" ảnh vào Pictures/DouyinInstagram. Lỗi: "+errors);busy(false);}});
                  });
              }
              private void saveToGallery(byte[] data,String type,String name) throws Exception {
                  Uri uri=null;
                  try {
                      ContentValues values=new ContentValues(); values.put(MediaStore.Images.Media.DISPLAY_NAME,name); values.put(MediaStore.Images.Media.MIME_TYPE,type);
                      values.put(MediaStore.Images.Media.RELATIVE_PATH,"Pictures/DouyinInstagram"); values.put(MediaStore.Images.Media.IS_PENDING,1);
                      uri=getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI,values);
                      if(uri==null)throw new IOException("Không tạo được tệp."); write(uri,data);
                      values.clear();values.put(MediaStore.Images.Media.IS_PENDING,0);getContentResolver().update(uri,values,null,null);
                  }catch(Exception ex){if(uri!=null)try{getContentResolver().delete(uri,null,null);}catch(Exception ignored){}throw ex;}
              }
              private void showError(Exception ex) {
                  runOnUiThread(() -> { if (!isFinishing() && !isDestroyed()) { status.setText("Không thành công: " + (ex.getMessage() == null ? "Lỗi kết nối hoặc dữ liệu" : ex.getMessage())); busy(false); } });
              }
              private static class Data {
                  final byte[] bytes; final String mime;
                  Data(byte[] bytes, String mime) { this.bytes = bytes; this.mime = mime; }
              }
              private static Data fetch(URI uri, int limit, boolean page) throws Exception {
                  for (int i = 0; i < 5; i++) {
                      if (!(page ? InstagramPublicImage.isPost(uri) : InstagramPublicImage.isImageHost(uri))) throw new IOException("Địa chỉ ngoài phạm vi được hỗ trợ hoặc trang yêu cầu đăng nhập.");
                      HttpURLConnection connection = (HttpURLConnection)uri.toURL().openConnection();
                      try {
                          connection.setInstanceFollowRedirects(false); connection.setConnectTimeout(15000); connection.setReadTimeout(20000);
                          connection.setRequestProperty("Accept", page ? "text/html,application/xhtml+xml" : "image/*");
                          connection.setRequestProperty("User-Agent", "InstagramImageViewer/1.1");
                          int code = connection.getResponseCode();
                          if (code >= 300 && code < 400) {
                              String location = connection.getHeaderField("Location");
                              if (location == null) throw new IOException("Chuyển hướng không hợp lệ.");
                              uri = uri.resolve(location); continue;
                          }
                          if (code != 200) throw new IOException("Instagram trả về HTTP " + code + ". Không thử vượt giới hạn truy cập.");
                          String type = connection.getContentType();
                          type = type == null ? "" : type.split(";", 2)[0].trim().toLowerCase(Locale.ROOT);
                          if (page ? !(type.equals("text/html") || type.equals("application/xhtml+xml")) : !type.startsWith("image/")) throw new IOException("Máy chủ không cung cấp nội dung phù hợp.");
                          if (connection.getContentLengthLong() > limit) throw new IOException("Tệp vượt giới hạn dung lượng.");
                          try (InputStream in = connection.getInputStream(); ByteArrayOutputStream out = new ByteArrayOutputStream()) {
                              byte[] buf = new byte[8192]; int n;
                              while ((n = in.read(buf)) != -1) { if (out.size() + n > limit) throw new IOException("Tệp vượt giới hạn dung lượng."); out.write(buf, 0, n); }
                              return new Data(out.toByteArray(), type);
                          }
                      } finally { connection.disconnect(); }
                  }
                  throw new IOException("Quá nhiều chuyển hướng.");
              }
              private void saveImage() {
                  if (image == null || previewOnly || !permission.isChecked()) return;
                  if (Build.VERSION.SDK_INT < 29) {
                      Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT).setType(mime).addCategory(Intent.CATEGORY_OPENABLE).putExtra(Intent.EXTRA_TITLE, filename);
                      startActivityForResult(intent, PICK_FILE); return;
                  }
                  final byte[] data = image; final String type = mime, name = filename;
                  busy(true);
                  executor.execute(() -> {
                      Uri uri = null;
                      try {
                          ContentValues values = new ContentValues(); values.put(MediaStore.Images.Media.DISPLAY_NAME, name); values.put(MediaStore.Images.Media.MIME_TYPE, type);
                          values.put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/DouyinInstagram"); values.put(MediaStore.Images.Media.IS_PENDING, 1);
                          uri = getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values);
                          if (uri == null) throw new IOException("Không tạo được tệp.");
                          write(uri, data);
                          values.clear(); values.put(MediaStore.Images.Media.IS_PENDING, 0); getContentResolver().update(uri, values, null, null);
                          runOnUiThread(() -> { if (!isFinishing() && !isDestroyed()) { status.setText("Đã lưu: Pictures/DouyinInstagram/" + name); busy(false); } });
                      } catch (Exception ex) { if (uri != null) try { getContentResolver().delete(uri, null, null); } catch (Exception ignored) {} showError(ex); }
                  });
              }
              private void write(Uri uri, byte[] data) throws IOException {
                  try (OutputStream out = getContentResolver().openOutputStream(uri, "w")) { if (out == null) throw new IOException("Không mở được tệp."); out.write(data); }
              }
              @Override protected void onActivityResult(int request, int result, Intent data) {
                  super.onActivityResult(request, result, data);
                  if (request != PICK_FILE || result != RESULT_OK || data == null || data.getData() == null || image == null || previewOnly || !permission.isChecked()) return;
                  final Uri uri = data.getData(); final byte[] bytes = image; busy(true);
                  executor.execute(() -> { try { write(uri, bytes); runOnUiThread(() -> { if (!isFinishing() && !isDestroyed()) { status.setText("Đã lưu ảnh."); busy(false); } }); } catch (Exception ex) { showError(ex); } });
              }
              @Override protected void onDestroy() { executor.shutdownNow(); super.onDestroy(); }
          }
          JAVA
          cat > app/src/main/java/com/douyin/downloader/InstagramPublicImage.java <<'JAVA'
          package com.douyin.downloader;
          
          import java.net.URI;
          import java.util.Locale;
          import java.util.regex.*;
          import java.util.HashMap;
          
          final class InstagramPublicImage {
              private static final Pattern LINK = Pattern.compile("https://[^\\s<>\\\"\\[\\]（）]+", Pattern.CASE_INSENSITIVE);
              private static final Pattern META = Pattern.compile("<meta\\b[^>]*>", Pattern.CASE_INSENSITIVE);
              private static final Pattern ATTR = Pattern.compile("([a-zA-Z_:][-a-zA-Z0-9_:.]*)\\s*=\\s*(?:\"([^\"]*)\"|'([^']*)'|([^\\s>]+))");
              private static boolean secure(URI u) { return u != null && "https".equalsIgnoreCase(u.getScheme()) && u.getHost() != null && u.getRawUserInfo() == null && (u.getPort() == -1 || u.getPort() == 443); }
              static boolean isPost(URI u) {
                  if (!secure(u)) return false;
                  String h = u.getHost().toLowerCase(Locale.ROOT);
                  return (h.equals("www.instagram.com") || h.equals("instagram.com")) && u.getPath().matches("/p/[A-Za-z0-9_-]+/?");
              }
              static boolean isImageHost(URI u) {
                  if (!secure(u)) return false;
                  String h = u.getHost().toLowerCase(Locale.ROOT);
                  return h.endsWith(".cdninstagram.com") || h.endsWith(".fbcdn.net");
              }
              static URI extract(String text) {
                  Matcher m = LINK.matcher(text);
                  while (m.find()) {
                      try {
                          URI uri = URI.create(m.group().replaceAll("[).,;!?]+$", ""));
                          if (isPost(uri)) return URI.create("https://www.instagram.com" + uri.getPath());
                          if (isImageHost(uri)) return uri;
                      } catch (IllegalArgumentException ignored) {}
                  }
                  throw new IllegalArgumentException("Cần link bài viết /p/ hoặc URL ảnh Instagram trực tiếp (HTTPS).");
              }
              static URI previewUrl(String html) {
                  Matcher tags = META.matcher(html);
                  while (tags.find()) {
                      HashMap<String, String> attributes = new HashMap<>(); Matcher a = ATTR.matcher(tags.group());
                      while (a.find()) attributes.put(a.group(1).toLowerCase(Locale.ROOT), a.group(2) != null ? a.group(2) : a.group(3) != null ? a.group(3) : a.group(4));
                      String property = attributes.get("property"); if (property == null) property = attributes.get("name");
                      if (!("og:image".equalsIgnoreCase(property) || "og:image:secure_url".equalsIgnoreCase(property))) continue;
                      String content = attributes.get("content"); if (content == null) continue;
                      try { URI uri = URI.create(content.replace("&amp;", "&").replace("&#38;", "&").replace("&#x26;", "&")); if (isImageHost(uri)) return uri; } catch (IllegalArgumentException ignored) {}
                  }
                  return null;
              }
