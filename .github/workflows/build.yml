                          Map<?,?> child=map(raw); if(!modern)child=map(child.get("node"));
                          Photo p=photo(child); if(p!=null&&seen.add(p.url))photos.add(p);
                      }
                      int expected=Math.max(Math.max(num(m.get("carousel_media_count")),num(edge.get("count"))),children.size());
                      return new Result(photos,expected,children.size(),true);
                  }
